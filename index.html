
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#142238">
<title>KINGZEE COLLECTION | Official Store</title>
<style>
:root{
 --navy:#142238;
 --navy2:#203752;
 --gold:#c9a45c;
 --goldlight:#ead5a5;
 --white:#ffffff;
 --paper:#f8f7f4;
 --ink:#202938;
 --muted:#777e88;
 --line:#e7e3da;
 --green:#16834a;
 --red:#a93838;
 --shadow:0 8px 28px rgba(20,34,56,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
 margin:0;background:var(--paper);color:var(--ink);
 font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
header{
 position:sticky;top:0;z-index:20;
 background:var(--navy);color:white;
 box-shadow:0 3px 15px #0002;
}
.topbar{
 max-width:1250px;margin:auto;padding:13px 18px;
 display:flex;justify-content:space-between;align-items:center;gap:15px;
}
.brand{display:flex;align-items:center;gap:11px}
.logo{
 width:47px;height:47px;border:2px solid var(--gold);
 border-radius:12px;display:grid;place-items:center;
 color:var(--gold);font-weight:900;font-size:20px;
}
.brand h1{font-size:16px;margin:0;letter-spacing:1.2px}
.brand small{display:block;color:var(--goldlight);
 font-size:9px;letter-spacing:2px;margin-top:5px}
nav{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
nav button{
 border:0;background:transparent;color:white;
 padding:10px;border-radius:5px;font-size:12px;
}
nav button:hover{background:#ffffff18}
nav .cartnav{background:var(--gold);color:var(--navy);font-weight:bold}
main{max-width:1250px;margin:auto;padding:25px 18px;min-height:65vh}
.hero{
 min-height:310px;padding:45px 30px;border-radius:13px;
 background:linear-gradient(110deg,#101c2d,#243e5b);
 color:white;display:flex;align-items:center;overflow:hidden;
 position:relative;
}
.hero:after{
 content:"KC";position:absolute;right:5%;top:12px;
 font-size:clamp(120px,25vw,260px);font-weight:900;
 color:#ffffff09;pointer-events:none;
}
.hero-content{position:relative;z-index:1;max-width:600px}
.eyebrow{color:var(--goldlight);font-size:11px;
 letter-spacing:3px;font-weight:bold}
.hero h2{font-size:clamp(30px,5vw,55px);line-height:1.1;margin:15px 0}
.hero p{line-height:1.7;color:#e1e5eb;max-width:480px}
.btn{
 border:0;border-radius:5px;padding:12px 17px;
 background:var(--navy);color:white;font-weight:bold;
 display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn.gold{background:var(--gold);color:#182638}
.btn.green{background:var(--green)}
.btn.light{background:#eeeae1;color:var(--navy)}
.btn.red{background:var(--red)}
.btn.outline{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.section-head{
 display:flex;justify-content:space-between;align-items:center;
 gap:12px;margin:30px 0 16px;
}
.section-head h2{margin:0;color:var(--navy);font-size:23px}
.muted{color:var(--muted);font-size:13px;line-height:1.6}
.goldtext{color:#9b762e}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
.card{
 background:white;border:1px solid var(--line);
 border-radius:9px;overflow:hidden;box-shadow:0 3px 12px #00000008;
}
.product-photo{
 width:100%;height:225px;background:#eeece7;
 display:flex;align-items:center;justify-content:center;
 overflow:hidden;
}
.product-photo img{
 width:100%;height:100%;object-fit:contain;
}
.no-photo{
 color:#9a917f;text-align:center;padding:25px;font-size:13px;
}
.cardbody{padding:14px}
.category-label{
 color:#947437;text-transform:uppercase;letter-spacing:1px;
 font-size:9px;font-weight:bold;
}
.card h3{font-size:15px;margin:8px 0}
.price{font-weight:bold;color:var(--navy);font-size:17px}
.stock{font-size:11px;color:var(--green);margin-top:7px}
.stock.out{color:var(--red)}
.card-actions{display:flex;gap:7px;margin-top:13px}
.card-actions .btn{flex:1;padding:10px 7px;font-size:11px}
.panel{
 background:white;border:1px solid var(--line);
 padding:20px;border-radius:9px;margin-bottom:17px;
 box-shadow:0 3px 12px #00000005;
}
.panel h2,.panel h3{color:var(--navy);margin-top:0}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:12px;font-weight:bold;color:var(--navy)}
.field input,.field select,.field textarea{
 width:100%;padding:12px;border:1px solid #ddd8ce;
 border-radius:5px;background:white;color:var(--ink);
 outline:none;min-width:0;
}
.field input:focus,.field textarea:focus,.field select:focus{
 border-color:var(--gold);
}
.field textarea{min-height:95px;resize:vertical}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.tag{
 display:inline-block;padding:5px 9px;border-radius:3px;
 background:#f1eee7;color:#76602e;font-size:10px;
}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.divider{border:0;border-top:1px solid var(--line);margin:17px 0}
.empty{text-align:center;padding:45px 15px;color:var(--muted)}
.notice{
 background:#f7f0df;color:#705b2e;padding:13px;
 border-radius:5px;font-size:13px;line-height:1.6;margin:12px 0;
}
.product-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:28px}
.photo-gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-gallery img{
 width:100%;height:250px;object-fit:contain;
 background:#eeece7;border-radius:7px;
}
.product-info h1{font-size:29px;color:var(--navy);margin:13px 0}
.product-info .price{font-size:23px;margin:12px 0}
.cart-item{
 display:flex;align-items:center;gap:12px;padding:13px 0;
 border-bottom:1px solid var(--line);
}
.cart-item img{width:70px;height:70px;object-fit:contain;background:#eeeae1;border-radius:5px}
.cart-item-info{flex:1;min-width:0}
.cart-item input{width:65px;padding:8px;border:1px solid var(--line);border-radius:5px}
footer{
 background:var(--navy);color:white;text-align:center;
 padding:30px 15px;margin-top:35px;
}
footer strong{color:var(--goldlight);letter-spacing:2px}
footer p{font-size:12px;color:#d4d9df}
.hidden{display:none!important}
.admin-stat{
 background:#f5f1e8;padding:18px;border-radius:7px;
}
.admin-stat strong{font-size:25px;color:var(--navy)}
.preview-images{display:flex;gap:8px;flex-wrap:wrap}
.preview-images img{width:85px;height:85px;object-fit:contain;background:#eeeae1;border-radius:5px}
footer small{color:#bfc7d1}
@media(max-width:850px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .product-layout{grid-template-columns:1fr}
 .product-photo{height:190px}
 .photo-gallery img{height:200px}
}
@media(max-width:580px){
 .topbar{align-items:flex-start;flex-direction:column;padding:12px}
 nav{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
 nav button{padding:10px 3px;font-size:11px}
 main{padding:17px 12px}
 .hero{min-height:280px;padding:30px 20px}
 .hero h2{font-size:35px}
 .grid{gap:10px}
 .product-photo{height:155px}
 .cardbody{padding:10px}
 .card h3{font-size:13px}
 .card-actions{flex-direction:column}
 .card-actions .btn{width:100%}
 .formgrid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .photo-gallery img{height:160px}
 .cart-item{flex-wrap:wrap}
 .cart-item-info{min-width:130px}
 .section-head h2{font-size:19px}
}
</style>
</head>
<body>

<header>
 <div class="topbar">
  <div class="brand">
   <div class="logo">KC</div>
   <div>
    <h1>KINGZEE COLLECTION</h1>
    <small>STYLE • QUALITY • ELEGANCE</small>
   </div>
  </div>
  <nav>
   <button onclick="goHome()">HOME</button>
   <button onclick="goShop()">SHOP</button>
   <button onclick="goCategories()">CATEGORIES</button>
   <button class="cartnav" onclick="goCart()">CART (<span id="cartCount">0</span>)</button>
   <button onclick="goContact()">CONTACT</button>
   <button onclick="goOwner()">OWNER</button>
  </nav>
 </div>
</header>

<main id="app">
 <div class="empty">Opening KINGZEE COLLECTION...</div>
</main>

<footer>
 <strong>KINGZEE COLLECTION</strong>
 <p>Style • Quality • Elegance</p>
 <small>Ghana · Prices in GH₵ · Orders through WhatsApp</small>
</footer>

<!-- WhatsApp is opened by a real clickable link, not a blocked popup. -->
<a id="whatsappLink" class="hidden" target="_blank" rel="noopener noreferrer"></a>

<script>
"use strict";

const DB_NAME = "KINGZEE_COLLECTION_LOCAL";
const DB_VERSION = 1;
const STORE = "products";
const WA_NUMBER = "233559114251";

let db = null;
let products = [];
let cart = JSON.parse(localStorage.getItem("kc_cart_v2") || "[]");
let ownerLoggedIn = false;
let currentPage = "home";
let previewURLs = [];

const DEFAULT_CATEGORIES = [
 "Bags & Wallets","Bottles","Dresses & Clothing","Shoes",
 "Necklaces","Bracelets","Watches","Personalised Gift Sets",
 "Awards & Plaques","Corporate Gifts & Accessories"
];

function el(id){return document.getElementById(id);}

function esc(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function money(value){
 return "GH₵"+Number(value||0).toFixed(2);
}

function makeId(){
 return "KC-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
}

function openDatabase(){
 return new Promise((resolve,reject)=>{
  if(!("indexedDB" in window)){
   reject(new Error("IndexedDB is not supported by this browser."));
   return;
  }
  const request=indexedDB.open(DB_NAME,DB_VERSION);
  request.onupgradeneeded=()=>{
   const database=request.result;
   if(!database.objectStoreNames.contains(STORE)){
    database.createObjectStore(STORE,{keyPath:"id"});
   }
  };
  request.onsuccess=()=>{db=request.result;resolve(db);};
  request.onerror=()=>reject(request.error);
  request.onblocked=()=>reject(new Error("Close other tabs using this website and reload."));
 });
}

function getAllProducts(){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readonly");
  const request=tx.objectStore(STORE).getAll();
  request.onsuccess=()=>resolve(request.result||[]);
  request.onerror=()=>reject(request.error);
 });
}

function putProduct(product){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readwrite");
  tx.objectStore(STORE).put(product);
  tx.oncomplete=()=>resolve();
  tx.onerror=()=>reject(tx.error);
 });
}

function deleteProductRecord(id){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readwrite");
  tx.objectStore(STORE).delete(id);
  tx.oncomplete=()=>resolve();
  tx.onerror=()=>reject(tx.error);
 });
}

async function reloadProducts(){
 products=await getAllProducts();
}

function clearPreviewURLs(){
 previewURLs.forEach(url=>URL.revokeObjectURL(url));
 previewURLs=[];
}

function getImageURL(blob){
 if(!blob)return "";
 const url=URL.createObjectURL(blob);
 previewURLs.push(url);
 return url;
}

function productImageHTML(product,index=0){
 const image=product.images?.[index];
 if(!image)return `<div class="no-photo">Product photograph<br>not uploaded yet</div>`;
 return `<img src="${getImageURL(image)}" alt="${esc(product.name)}">`;
}

function updateCartCount(){
 const count=cart.reduce((total,item)=>total+Number(item.qty||0),0);
 el("cartCount").textContent=count;
 localStorage.setItem("kc_cart_v2",JSON.stringify(cart));
}

function render(html){
 clearPreviewURLs();
 el("app").innerHTML=html;
 window.scrollTo({top:0,behavior:"instant"});
}

function greeting(){
 const hour=new Date().getHours();
 if(hour<12)return "Good morning";
 if(hour<17)return "Good afternoon";
 return "Good evening";
}

function goHome(){
 currentPage="home";
 const featured=products.filter(p=>p.featured);
 const list=featured.length?featured.slice(0,4):products.slice(0,4);

 render(`
 <section class="hero">
  <div class="hero-content">
   <div class="eyebrow">WELCOME TO KINGZEE COLLECTION</div>
   <h2>Elegance in every detail.</h2>
   <p>Discover fashion, accessories, personalised gifts and
   corporate collections. Find something special for every occasion.</p>
   <button class="btn gold" onclick="goShop()">EXPLORE THE COLLECTION</button>
  </div>
 </section>
 <div class="section-head">
  <h2>Featured Collection</h2>
  <button class="btn light" onclick="goShop()">View all</button>
 </div>
 <div class="grid">
  ${list.map(productCard).join("") ||
   `<div class="empty">Our collection is being prepared. Please check back soon.</div>`}
 </div>
 <div class="panel" style="margin-top:28px;text-align:center">
  <h2>Find your perfect item</h2>
  <p class="muted">Browse our catalogue and order conveniently through WhatsApp.</p>
  <button class="btn gold" onclick="goCategories()">EXPLORE CATEGORIES</button>
 </div>`);
}

function productCard(p){
 const price=p.price===null?"Price on Request":money(p.price);
 return `
 <article class="card">
  <div class="product-photo">${productImageHTML(p)}</div>
  <div class="cardbody">
   <div class="category-label">${esc(p.category)}</div>
   <h3>${esc(p.name)}</h3>
   <div class="price">${price}</div>
   <div class="stock ${p.stock==="Out of Stock"?"out":""}">
    ${esc(p.stock||"Available")}
   </div>
   <div class="card-actions">
    <button class="btn light" onclick="openProduct('${p.id}')">VIEW DETAILS</button>
    <button class="btn" onclick="addSimple('${p.id}')">ADD TO CART</button>
   </div>
  </div>
 </article>`;
}

function goShop(){
 currentPage="shop";
 render(`
 <div class="section-head"><h2>Shop All Products</h2>
 <span class="muted">${products.length} items</span></div>
 <div class="field"><input id="searchProducts" placeholder="Search our collection..." oninput="filterShop()"></div>
 <div class="grid" id="shopGrid">
 ${products.map(productCard).join("") ||
 '<div class="empty">No products have been posted yet.</div>'}
 </div>`);
}

function filterShop(){
 const q=el("searchProducts").value.toLowerCase();
 el("shopGrid").innerHTML=products.filter(p=>
  (p.name+" "+p.category+" "+p.description).toLowerCase().includes(q)
 ).map(productCard).join("") || '<div class="empty">No matching products.</div>';
}

function goCategories(){
 currentPage="categories";
 const categories=[...new Set([
  ...DEFAULT_CATEGORIES,...products.map(p=>p.category)
 ])];
 render(`
 <div class="section-head"><h2>Shop by Category</h2></div>
 <div class="grid">
 ${categories.map(c=>{
  const count=products.filter(p=>p.category===c).length;
  return `<div class="panel">
   <span class="tag">${count} products</span>
   <h3 style="margin-top:13px">${esc(c)}</h3>
   <button class="btn" onclick="openCategory('${encodeURIComponent(c)}')">EXPLORE</button>
  </div>`;
 }).join("")}
 </div>`);
}

function openCategory(encoded){
 const category=decodeURIComponent(encoded);
 const list=products.filter(p=>p.category===category);
 render(`
 <div class="section-head">
  <h2>${esc(category)}</h2>
  <button class="btn light" onclick="goCategories()">BACK</button>
 </div>
 <div class="grid">${list.map(productCard).join("") ||
 '<div class="empty">No products in this category yet.</div>'}</div>`);
}

function openProduct(id){
 const p=products.find(item=>item.id===id);
 if(!p)return;
 currentPage="product";
 const gallery=p.images?.length
  ?p.images.map((image,i)=>`<img src="${getImageURL(image)}" alt="${esc(p.name)} image ${i+1}">`).join("")
  :'<div class="empty">No product photographs uploaded.</div>';

 render(`
 <button class="btn light" onclick="goShop()">← BACK TO SHOP</button>
 <div class="product-layout" style="margin-top:22px">
  <div class="photo-gallery">${gallery}</div>
  <div class="product-info">
   <span class="tag">${esc(p.category)}</span>
   <h1>${esc(p.name)}</h1>
   <div class="price">${p.price===null?"Price on Request":money(p.price)}</div>
   <p>${esc(p.description||"Product details available on request.")}</p>
   <p class="muted">Availability: ${esc(p.stock||"Available")}</p>
   <div class="field">
    <label>Choose variation</label>
    <select id="selectedVariation">
     <option value="">Select if applicable</option>
     ${(p.variations||[]).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")}
    </select>
   </div>
   <div class="field">
    <label>Quantity</label>
    <input id="selectedQuantity" type="number" min="1" max="99" value="1">
   </div>
   <div class="actions">
    <button class="btn" onclick="addDetailToCart('${p.id}')">ADD TO CART</button>
    <button class="btn green" onclick="buyNow('${p.id}')">ORDER VIA WHATSAPP</button>
   </div>
  </div>
 </div>`);
}

function addSimple(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;
 if(p.stock==="Out of Stock"){alert("This product is currently out of stock.");return;}
 cart.push({id,qty:1,variation:""});
 updateCartCount();
 alert("Added to your shopping cart.");
}

function addDetailToCart(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;
 if(p.stock==="Out of Stock"){alert("This product is currently out of stock.");return;}
 const qty=Math.max(1,Math.min(99,Number(el("selectedQuantity").value)||1));
 const variation=el("selectedVariation").value;
 cart.push({id,qty,variation});
 updateCartCount();
 alert("Product added to your cart.");
 goCart();
}

function buyNow(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;
 if(p.stock==="Out of Stock"){alert("This product is currently out of stock.");return;}
 const qty=Math.max(1,Math.min(99,Number(el("selectedQuantity").value)||1));
 const variation=el("selectedVariation").value;
 cart.push({id,qty,variation});
 updateCartCount();
 goCart();
}

function goCart(){
 currentPage="cart";
 const lines=cart.map((item,index)=>{
  const p=products.find(x=>x.id===item.id);
  if(!p)return "";
  return `<div class="cart-item">
   <div style="width:70px;height:70px;flex-shrink:0" class="product-photo">
    ${productImageHTML(p)}
   </div>
   <div class="cart-item-info">
    <strong>${esc(p.name)}</strong>
    <div class="muted">${esc(item.variation||"Standard")}</div>
    <div class="price">${p.price===null?"Price on Request":money(p.price)}</div>
   </div>
   <input aria-label="Quantity" type="number" min="1" max="99"
    value="${item.qty}" onchange="changeQuantity(${index},this.value)">
   <button class="btn red" onclick="removeItem(${index})">REMOVE</button>
  </div>`;
 }).join("");

 const subtotal=cart.reduce((sum,item)=>{
  const p=products.find(x=>x.id===item.id);
  return sum+(p&&p.price!==null?p.price*item.qty:0);
 },0);
 const unpriced=cart.some(item=>{
  const p=products.find(x=>x.id===item.id);
  return p&&p.price===null;
 });

 render(`
 <div class="section-head"><h2>Your Shopping Cart</h2></div>
 <div class="panel">
 ${lines||'<div class="empty">Your cart is empty. Start shopping!</div>'}
 <hr>
 <div class="row"><strong>Subtotal</strong><strong class="price">${money(subtotal)}</strong></div>
 ${unpriced?'<div class="notice">Some products have prices on request. Management will confirm the final amount on WhatsApp.</div>':""}
 <p class="muted">Delivery charges, if any, will be agreed with management.</p>
 <div class="actions">
  <button class="btn light" onclick="goShop()">CONTINUE SHOPPING</button>
  <button class="btn green" onclick="prepareWhatsAppOrder()" ${cart.length?"":"disabled"}>
   PLACE ORDER ON WHATSAPP
  </button>
 </div>
 </div>`);
}

function changeQuantity(index,value){
 cart[index].qty=Math.max(1,Math.min(99,Number(value)||1));
 updateCartCount();goCart();
}

function removeItem(index){
 cart.splice(index,1);
 updateCartCount();goCart();
}

function prepareWhatsAppOrder(){
 if(!cart.length){alert("Your shopping cart is empty.");return;}

 let total=0;
 const itemLines=cart.map((item,index)=>{
  const p=products.find(x=>x.id===item.id);
  if(!p)return "";
  if(p.price!==null)total+=p.price*item.qty;
  return `${index+1}. ${p.name}
Quantity: ${item.qty}
Variation: ${item.variation||"Not specified"}
Price: ${p.price===null?"Price on Request":money(p.price)}
`;
 }).filter(Boolean).join("\n");

 const message=`Hello KINGZEE COLLECTION, ${greeting()}!

I would like to place an order from your collection.

MY SELECTED ITEMS:

${itemLines}
-------------------------
Subtotal of priced items: ${money(total)}

CUSTOMER DETAILS:
Full name:
Location:
Delivery or collection:

Please confirm product availability, final amount and payment instructions.

Thank you.`;

 const whatsappURL=
  "https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(message);

 // Navigate directly to the WhatsApp universal link.
 // No window.open popup is used.
 const link=el("whatsappLink");
 link.href=whatsappURL;
 link.target="_blank";
 link.rel="noopener noreferrer";
 link.click();

 // Keep the cart so the customer can return and amend the order.
}

function goContact(){
 currentPage="contact";
 render(`
 <div class="panel" style="max-width:650px;margin:auto">
  <div class="eyebrow goldtext">GET IN TOUCH</div>
  <h2>KINGZEE COLLECTION</h2>
  <p>For product enquiries, availability, pricing and orders,
  contact our management through WhatsApp.</p>
  <h2>0559 11 42 51</h2>
  <a class="btn green" href="https://wa.me/${WA_NUMBER}" target="_blank"
  rel="noopener noreferrer">OPEN WHATSAPP</a>
 </div>`);
}

function goOwner(){
 currentPage="owner";
 const hasPIN=localStorage.getItem("kc_owner_pin_v2");
 if(ownerLoggedIn){ownerDashboard();return;}

 render(`
 <div class="panel" style="max-width:440px;margin:30px auto">
  <div class="eyebrow goldtext">PRIVATE MANAGEMENT</div>
  <h2>${hasPIN?"OWNER LOGIN":"CREATE OWNER ACCESS"}</h2>
  <p class="muted">${hasPIN?
  "Enter your PIN to access product and website management.":
  "Create your private owner PIN on this device."}</p>
  <div class="field">
   <label>${hasPIN?"OWNER PIN":"CREATE NEW PIN"}</label>
   <input id="ownerPIN" type="password" autocomplete="new-password"
    placeholder="Enter PIN">
  </div>
  ${hasPIN?"":`
  <div class="field">
   <label>CONFIRM PIN</label>
   <input id="confirmPIN" type="password" placeholder="Confirm PIN">
  </div>`}
  <button class="btn gold" onclick="${hasPIN?"verifyOwnerPIN()":"createOwnerPIN()"}">
   ${hasPIN?"LOGIN":"CREATE OWNER ACCESS"}
  </button>
 </div>`);
}

async function hashPIN(pin){
 const data=new TextEncoder().encode(pin);
 if(crypto.subtle){
  const hash=await crypto.subtle.digest("SHA-256",data);
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
 }
 // Fallback is obfuscation, not cryptographic protection.
 let value=2166136261;
 for(let i=0;i<pin.length;i++)value=Math.imul(value^pin.charCodeAt(i),16777619);
 return "fallback-"+(value>>>0).toString(16);
}

async function createOwnerPIN(){
 const pin=el("ownerPIN").value;
 const confirm=el("confirmPIN").value;
 if(pin.length<4){alert("Your PIN must contain at least 4 characters.");return;}
 if(pin!==confirm){alert("The PIN entries do not match.");return;}
 localStorage.setItem("kc_owner_pin_v2",await hashPIN(pin));
 alert("Owner access created on this device.");
 goOwner();
}

async function verifyOwnerPIN(){
 const pin=el("ownerPIN").value;
 const saved=localStorage.getItem("kc_owner_pin_v2");
 if(await hashPIN(pin)===saved){
  ownerLoggedIn=true;ownerDashboard();
 }else{
  alert("Incorrect PIN. Please try again.");
 }
}

function logoutOwner(){
 ownerLoggedIn=false;
 goOwner();
}

 if(!ownerLoggedIn){goOwner();return;}
 currentPage="dashboard";

 const categoryOptions=[...new Set([
  ...DEFAULT_CATEGORIES,...products.map(p=>p.category)
 ])];

 render(`
 <div class="section-head">
  <h2>Owner Dashboard</h2>
  <button class="btn red" onclick="logoutOwner()">LOG OUT</button>
 </div>
 <div class="grid">
  <div class="admin-stat"><strong>${products.length}</strong><br><span class="muted">Products</span></div>
  <div class="admin-stat"><strong>${categoryOptions.length}</strong><br><span class="muted">Categories</span></div>
  <div class="admin-stat"><strong>${products.filter(p=>p.stock==="Available").length}</strong><br><span class="muted">Available</span></div>
  <div class="admin-stat"><strong>${products.filter(p=>p.price===null).length}</strong><br><span class="muted">Price on Request</span></div>
 </div>

 <div class="panel">
  <h2>Post New Product</h2>
  <div class="formgrid">
   <div class="field"><label>PRODUCT NAME *</label>
    <input id="newName" placeholder="Enter product name"></div>
   <div class="field"><label>CATEGORY *</label>
    <input id="newCategory" list="categoryOptions" placeholder="Choose or enter category">
    <datalist id="categoryOptions">
     ${categoryOptions.map(c=>`<option value="${esc(c)}">`).join("")}
    </datalist>
   </div>
   <div class="field"><label>PRICE (GH₵)</label>
    <input id="newPrice" type="number" min="0" step="0.01" placeholder="Leave blank for enquiry"></div>
   <div class="field"><label>STOCK STATUS</label>
    <select id="newStock">
     <option>Available</option><option>Out of Stock</option><option>Preorder</option>
    </select>
   </div>
   <div class="field full"><label>PRODUCT DESCRIPTION</label>
    <textarea id="newDescription" placeholder="Enter full product details"></textarea>
   </div>
   <div class="field full"><label>VARIATIONS</label>
    <input id="newVariations" placeholder="Example: Black, White, Small, Medium">
   </div>
   <div class="field full"><label>UPLOAD PRODUCT PHOTOS</label>
    <input id="newImages" type="file" accept="image/*" multiple>
    <div class="preview-images" id="imagePreview"></div>
    <small class="muted">Images are saved on this device using IndexedDB.</small>
   </div>
   <div class="field full"><label>FEATURE ON HOMEPAGE?</label>
    <select id="newFeatured"><option value="no">No</option><option value="yes">Yes</option></select>
   </div>
  </div>
  <button class="btn gold" onclick="saveNewProduct()">PUBLISH PRODUCT</button>
 </div>

 <div class="panel">
  <h2>Manage Existing Products</h2>
  <div id="managedProducts"></div>
 </div>

 <div class="panel">
  <h2>Website Settings</h2>
  <div class="field"><label>WHATSAPP NUMBER (INTERNATIONAL FORMAT)</label>
   <input id="ownerWA" value="${esc(localStorage.getItem("kc_wa")||WA_NUMBER)}">
  </div>
  <button class="btn" onclick="saveWhatsApp()">SAVE WHATSAPP NUMBER</button>
  <hr>
  <button class="btn light" onclick="changeOwnerPIN()">CHANGE OWNER PIN</button>
  <button class="btn light" onclick="exportBackup()">EXPORT BACKUP</button>
  <button class="btn light" onclick="importBackup()">RESTORE BACKUP</button>
  <button class="btn red" onclick="eraseAllData()">DELETE ALL PRODUCTS</button>
  <p class="notice">Keep your backup file safe. Clearing browser data may remove your catalogue.</p>
 </div>
 `);

 renderManagedProducts();

 el("newImages").addEventListener("change",()=>{
  const preview=el("imagePreview");
  preview.innerHTML="";
  [...el("newImages").files].forEach(file=>{
   const img=document.createElement("img");
   img.src=URL.createObjectURL(file);
   preview.appendChild(img);
  });
 });
}

async function saveNewProduct(){
 if(!ownerLoggedIn)return;
 const name=el("newName").value.trim();
 const category=el("newCategory").value.trim();
 const rawPrice=el("newPrice").value.trim();

 if(!name||!category){alert("Enter a product name and category.");return;}

 let price=null;
 if(rawPrice!==""){
  price=Number(rawPrice);
  if(!Number.isFinite(price)||price<0){
   alert("Please enter a valid price.");return;
  }
 }

 const files=[...el("newImages").files];
 let images=[];
 try{
  images=await Promise.all(files.map(async file=>{
   if(!file.type.startsWith("image/"))throw new Error("Invalid image");
   return new Blob([await file.arrayBuffer()],{type:file.type});
  }));
 }catch(e){alert("Could not read one of the uploaded images.");return;}

 const product={
  id:makeId(),
  name,category,price,
  description:el("newDescription").value.trim(),
  stock:el("newStock").value,
  variations:el("newVariations").value.split(",").map(v=>v.trim()).filter(Boolean),
  featured:el("newFeatured").value==="yes",
  images,
  createdAt:new Date().toISOString()
 };

 try{
  await putProduct(product);
  await reloadProducts();
  alert("Product successfully published to this device.");
  ownerDashboard();
 }catch(e){
  alert("Storage could not save this product. Try smaller images or free device space.");
 }
}

function renderManagedProducts(){
 const target=el("managedProducts");
 if(!target)return;

 target.innerHTML=products.map(p=>`
 <div class="cart-item">
  <div class="cart-item-info">
   <strong>${esc(p.name)}</strong>
   <div class="muted">${esc(p.category)}</div>
   <div class="price">${p.price===null?"Price on Request":money(p.price)}</div>
   <div class="muted">${esc(p.stock)}</div>
  </div>
  <button class="btn light" onclick="editProduct('${p.id}')">EDIT</button>
  <button class="btn red" onclick="deleteProduct('${p.id}')">DELETE</button>
 </div>`).join("")||'<div class="empty">No products posted yet.</div>';
}

async function editProduct(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;

 const name=prompt("Product name:",p.name);
 if(name===null)return;
 const category=prompt("Category:",p.category);
 if(category===null)return;
 const price=prompt("Price in GH₵ (blank means Price on Request):",p.price===null?"":p.price);
 if(price===null)return;
 const description=prompt("Product description:",p.description||"");
 if(description===null)return;
 const stock=prompt("Stock status: Available, Out of Stock or Preorder",p.stock);
 if(stock===null)return;
 const variations=prompt("Variations separated by commas:",(p.variations||[]).join(", "));
 if(variations===null)return;

 p.name=name.trim();
 p.category=category.trim();
 p.price=price.trim()===""?null:Number(price);
 p.description=description;
 p.stock=stock;
 p.variations=variations.split(",").map(v=>v.trim()).filter(Boolean);

 if(!p.name||!p.category||(p.price!==null&&(!Number.isFinite(p.price)||p.price<0))){
  alert("Please check the product details.");return;
 }
 await putProduct(p);
 await reloadProducts();
 ownerDashboard();
}

async function deleteProduct(id){
 if(!ownerLoggedIn)return;
 if(!confirm("Permanently delete this product from this device?"))return;
 await deleteProductRecord(id);
 cart=cart.filter(x=>x.id!==id);
 updateCartCount();
 await reloadProducts();
 ownerDashboard();
}

function saveWhatsApp(){
 const number=el("ownerWA").value.replace(/\D/g,"");
 if(number.length<10){alert("Enter a valid international WhatsApp number.");return;}
 localStorage.setItem("kc_wa",number);
 alert("WhatsApp number updated.");
}

function getWhatsAppNumber(){
 return localStorage.getItem("kc_wa")||WA_NUMBER;
}

async function changeOwnerPIN(){
 const old=prompt("Enter your current PIN:");
 if(old===null)return;
 if(await hashPIN(old)!==localStorage.getItem("kc_owner_pin_v2")){
  alert("Incorrect current PIN.");return;
 }
 const next=prompt("Enter your new PIN (at least 4 characters):");
 if(!next||next.length<4){alert("PIN must have at least 4 characters.");return;}
 const confirmNext=prompt("Confirm your new PIN:");
 if(next!==confirmNext){alert("PIN entries do not match.");return;}
 localStorage.setItem("kc_owner_pin_v2",await hashPIN(next));
 alert("Owner PIN changed.");
}

async function exportBackup(){
 if(!ownerLoggedIn)return;
 try{
  const data=await getAllProducts();
  const output=[];
  for(const p of data){
   const images=[];
   for(const image of (p.images||[])){
    images.push(await blobToDataURL(image));
   }
   output.push({...p,images});
  }
  const backup={
   application:"KINGZEE COLLECTION",
   version:2,
   createdAt:new Date().toISOString(),
   products:output
  };
  const blob=new Blob([JSON.stringify(backup)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="KINGZEE-COLLECTION-BACKUP.json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
 }catch(e){
  alert("Backup failed. Your catalogue may be too large for one export.");
 }
}

function blobToDataURL(blob){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(reader.error);
  reader.readAsDataURL(blob);
 });
}

function dataURLToBlob(url){
 const parts=url.split(",");
 const mime=parts[0].match(/:(.*?);/)[1];
 const binary=atob(parts[1]);
 const bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
 return new Blob([bytes],{type:mime});
}

function importBackup(){
 if(!ownerLoggedIn)return;
 const input=document.createElement("input");
 input.type="file";
 input.accept=".json,application/json";
 input.onchange=async()=>{
  const file=input.files[0];
  if(!file)return;
  try{
   const backup=JSON.parse(await file.text());
   if(backup.application!=="KINGZEE COLLECTION"||
    !Array.isArray(backup.products))throw new Error("Invalid backup");

   if(!confirm("Restore this backup? Matching product IDs will be replaced."))return;

   for(const item of backup.products){
    const product={...item,images:(item.images||[]).map(dataURLToBlob)};
    await putProduct(product);
   }
   await reloadProducts();
   alert("Backup restored successfully.");
   ownerDashboard();
  }catch(e){
   alert("Backup could not be restored. Please select a valid KINGZEE COLLECTION backup.");
  }
 };
 input.click();
}

async function eraseAllData(){
 if(!ownerLoggedIn)return;
 if(!confirm("Delete ALL products and photographs from this device?"))return;
 if(!confirm("This cannot be undone without a backup. Continue?"))return;
 const tx=db.transaction(STORE,"readwrite");
 tx.objectStore(STORE).clear();
 tx.oncomplete=async()=>{
  cart=[];updateCartCount();
  await reloadProducts();
  ownerDashboard();
 };
}

async function start(){
 try{
  await openDatabase();
  await reloadProducts();
  updateCartCount();
  goHome();
 }catch(error){
  render(`
   <div class="panel">
    <h2>Storage could not start</h2>
    <p>${esc(error.message)}</p>
    <p class="muted">Open this website in a recent version of Chrome, Safari, Edge or Firefox. Browser privacy settings or opening a file directly may prevent local storage from working.</p>
    <button class="btn" onclick="location.reload()">TRY AGAIN</button>
   </div>`);
 }
}

start();
</script>

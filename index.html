
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KINGZEE COLLECTION</title>
<style>
:root{--navy:#142b49;--gold:#c9a24d;--bg:#f5f6f8;--green:#16834a;--red:#bd3838;--line:#e5e8ed}
*{box-sizing:border-box}
html{touch-action:pan-y}
body{margin:0;background:var(--bg);color:#202938;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
img{max-width:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
header{background:var(--navy);color:white;padding:14px 4%;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px}
.logo{height:43px;width:43px;border:2px solid var(--gold);border-radius:10px;display:grid;place-items:center;color:var(--gold);font-size:20px;font-weight:bold}
.brand h1{font-size:16px;margin:0}
.brand small{font-size:10px;color:#e5c77c;letter-spacing:2px}
nav{display:flex;gap:5px;flex-wrap:wrap}
nav button{background:transparent;color:white;border:0;padding:9px 8px;border-radius:6px}
nav button:hover{background:#ffffff20}
main{max-width:1150px;margin:auto;padding:22px 15px;min-height:65vh}
.hero{padding:42px 24px;background:linear-gradient(120deg,#142b49,#315578);border-radius:15px;color:white;margin-bottom:25px}
.hero h2{font-size:clamp(28px,5vw,43px);margin:12px 0}
.hero p{line-height:1.6;color:#e2e8f0}
.goldtext{color:#e5c77c}
.btn{border:0;border-radius:7px;background:var(--navy);color:white;padding:11px 15px;font-weight:bold;display:inline-block;text-decoration:none;text-align:center}
.goldbtn{background:var(--gold);color:#172235}
.greenbtn{background:var(--green);color:white}
.lightbtn{background:#e9edf3;color:var(--navy)}
.redbtn{background:var(--red)}
button:disabled{opacity:.5}
h2{color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card,.panel{background:white;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.card img{width:100%;height:210px;object-fit:contain;background:#f0f1f3;display:block}
.cardbody{padding:13px}
.card h3{margin:9px 0}
.price{color:var(--navy);font-weight:bold;font-size:17px}
.muted{color:#78818e;font-size:13px}
.tag{background:#edf0f4;color:#40516a;border-radius:20px;padding:5px 9px;font-size:11px}
.panel{padding:17px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:bold;font-size:13px;color:var(--navy)}
.field input,.field textarea,.field select{padding:12px;border:1px solid #d6dce4;border-radius:7px;width:100%;background:white}
.field textarea{min-height:85px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.actions>*{flex:1}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 15px}
.sectionhead h2{margin:0}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery img{width:100%;height:220px;object-fit:contain;background:#f0f1f3;border-radius:9px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:20px}
.cartrow{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}
.cartrow img{width:65px;height:65px;object-fit:contain;background:#eee;border-radius:7px}
.qty{width:65px;padding:8px}
.notice{background:#fff5dc;padding:12px;border-radius:7px;color:#72551d;font-size:13px}
.empty{text-align:center;padding:35px;color:#78818e}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
footer{text-align:center;background:var(--navy);color:white;padding:25px}
.hidden{display:none}
@media(max-width:720px){
 header{position:relative}
 nav{width:100%;justify-content:space-between}
 nav button{font-size:12px;padding:8px 5px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card img{height:155px}
 .detail{grid-template-columns:1fr}
 .gallery img{height:170px}
 .formgrid{grid-template-columns:1fr}
 .full{grid-column:auto}
}
@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
 <div class="brand">
  <div class="logo">KC</div>
  <div><h1>KINGZEE COLLECTION</h1><small>STYLE • QUALITY • ELEGANCE</small></div>
 </div>
 <nav>
  <button onclick="home()">Home</button>
  <button onclick="shop()">Shop</button>
  <button onclick="categories()">Categories</button>
  <button onclick="showCart()">Cart (<span id="cartCount">0</span>)</button>
  <button onclick="contact()">Contact</button>
  <button onclick="login()">Owner</button>
 </nav>
</header>

<main id="app"></main>

<footer>
 <strong>KINGZEE COLLECTION</strong>
 <p>STYLE • QUALITY • ELEGANCE</p>
 <small>Ghana Cedis (GH₵) | WhatsApp Orders</small>
</footer>

<script>
const DB_NAME="KC_COLLECTION_LOCAL";
const STORE="products";
const WHATSAPP_NUMBER="233559114251";
let db,products=[],owner=false;
let cart=JSON.parse(localStorage.getItem("kc_cart")||"[]");

function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{
   if(!r.result.objectStoreNames.contains(STORE))
    r.result.createObjectStore(STORE,{keyPath:"id"});
  };
  r.onsuccess=()=>{db=r.result;resolve()};
  r.onerror=()=>reject(r.error);
 });
}
function getProducts(){
 return new Promise((resolve,reject)=>{
  const r=db.transaction(STORE,"readonly").objectStore(STORE).getAll();
  r.onsuccess=()=>resolve(r.result||[]);
  r.onerror=()=>reject(r.error);
 });
}
function saveProduct(p){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readwrite");
  tx.objectStore(STORE).put(p);
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
 });
}
function deleteProduct(id){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readwrite");
  tx.objectStore(STORE).delete(id);
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
 });
}
async function refresh(){products=await getProducts()}
function money(n){return "GH₵"+Number(n).toFixed(2)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function page(html){document.getElementById("app").innerHTML=html;window.scrollTo(0,0)}
function updateCart(){
 localStorage.setItem("kc_cart",JSON.stringify(cart));
 document.getElementById("cartCount").textContent=cart.reduce((a,b)=>a+b.qty,0);
}
function photoURL(p){
 return p.images&&p.images.length?URL.createObjectURL(p.images[0]):"";
}
function card(p){
 const img=photoURL(p);
 return `<div class="card">
 ${img?`<img src="${img}" alt="${esc(p.name)}">`:'<div class="empty">No photograph</div>'}
 <div class="cardbody">
 <span class="tag">${esc(p.category)}</span>
 <h3>${esc(p.name)}</h3>
 <div class="price">${p.price===null?"Price on Request":money(p.price)}</div>
 <p class="muted">${esc(p.stock||"Available")}</p>
 <div class="actions">
 <button class="btn lightbtn" onclick="details('${p.id}')">View Product</button>
 <button class="btn" onclick="addQuick('${p.id}')">Add to Cart</button>
 </div></div></div>`;
}
function home(){
 const featured=products.filter(p=>p.featured);
 page(`<section class="hero">
 <div class="goldtext">WELCOME TO</div>
 <h2>KINGZEE COLLECTION</h2>
 <p>Discover fashion, accessories, personalised gifts and corporate collections.</p>
 <button class="btn goldbtn" onclick="shop()">EXPLORE SHOP</button>
 </section>
 <div class="sectionhead"><h2>Featured Products</h2><button class="btn lightbtn" onclick="shop()">View all</button></div>
 <div class="grid">${featured.map(card).join("")||'<div class="empty">Featured products will appear here.</div>'}</div>`);
}
function shop(){
 page(`<div class="sectionhead"><h2>Our Products</h2><span class="muted">${products.length} products</span></div>
 <div class="field"><input id="search" placeholder="Search products..." oninput="filterShop()"></div>
 <div class="grid" id="productGrid">${products.map(card).join("")||'<div class="empty">No products available yet.</div>'}</div>`);
}
function filterShop(){
 const q=document.getElementById("search").value.toLowerCase();
 document.getElementById("productGrid").innerHTML=products.filter(p=>(p.name+" "+p.category).toLowerCase().includes(q)).map(card).join("")||'<div class="empty">No results.</div>';
}
function categories(){
 const cats=[...new Set(products.map(p=>p.category))];
 page(`<h2>Shop by Category</h2><div class="grid">
 ${cats.map(c=>`<div class="panel"><h3>${esc(c)}</h3><button class="btn" onclick="categoryPage('${encodeURIComponent(c)}')">View Products</button></div>`).join("")||'<div class="empty">Categories appear when products are posted.</div>'}
 </div>`);
}
function categoryPage(c){
 c=decodeURIComponent(c);
 page(`<div class="sectionhead"><h2>${esc(c)}</h2><button class="btn lightbtn" onclick="categories()">Back</button></div>
 <div class="grid">${products.filter(p=>p.category===c).map(card).join("")}</div>`);
}
function details(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 const pics=(p.images||[]).map(img=>`<img src="${URL.createObjectURL(img)}" alt="${esc(p.name)}">`).join("");
 page(`<button class="btn lightbtn" onclick="shop()">← Back to Shop</button>
 <div class="detail"><div class="gallery">${pics||'<div class="empty">No pictures</div>'}</div>
 <div><span class="tag">${esc(p.category)}</span><h1>${esc(p.name)}</h1>
 <div class="price">${p.price===null?"Price on Request":money(p.price)}</div>
 <p>${esc(p.description)}</p><p class="muted">${esc(p.stock)}</p>
 <div class="field"><label>Choose variation</label>
 <select id="variation"><option value="">Not specified</option>${(p.variations||[]).map(v=>`<option>${esc(v)}</option>`).join("")}</select></div>
 <div class="field"><label>Quantity</label><input id="detailQty" type="number" min="1" value="1"></div>
 <button class="btn" onclick="addDetail('${id}')">ADD TO CART</button>
 <button class="btn greenbtn" onclick="orderSingle('${id}')">ORDER VIA WHATSAPP</button>
 </div></div>`);
}
function addQuick(id){
 cart.push({id,qty:1,variation:""});
 updateCart();alert("Added to cart.");shop();
}
function addDetail(id){
 const qty=Math.max(1,Number(document.getElementById("detailQty").value)||1);
 const variation=document.getElementById("variation").value;
 cart.push({id,qty,variation});updateCart();
 alert("Product added to cart.");showCart();
}
function showCart(){
 const rows=cart.map((x,i)=>{
  const p=products.find(y=>y.id===x.id);if(!p)return "";
  return `<div class="cartrow">
  <div style="flex:1"><strong>${esc(p.name)}</strong><p class="muted">${esc(x.variation||"No variation")}</p>
  ${p.price===null?"Price on Request":money(p.price)}</div>
  <input class="qty" type="number" min="1" value="${x.qty}" onchange="setQty(${i},this.value)">
  <button class="btn redbtn" onclick="removeItem(${i})">Remove</button>
  </div>`;
 }).join("");
 const total=cart.reduce((sum,x)=>{const p=products.find(y=>y.id===x.id);return sum+(p&&p.price!==null?p.price*x.qty:0)},0);
 const unpriced=cart.some(x=>{const p=products.find(y=>y.id===x.id);return p&&p.price===null});
 page(`<h2>Your Shopping Cart</h2>${rows||'<div class="empty">Your cart is empty.</div>'}
 <div class="panel"><h3>Order Summary</h3>
 <div class="sectionhead"><span>Subtotal of priced items</span><strong>${money(total)}</strong></div>
 ${unpriced?'<p class="notice">Some products have prices on request. Management will confirm their prices on WhatsApp.</p>':""}
 <button class="btn greenbtn" style="width:100%" onclick="checkout()" ${cart.length?"":"disabled"}>PLACE ORDER ON WHATSAPP</button>
 <p><button class="btn lightbtn" onclick="shop()">Continue Shopping</button></p></div>`);
}
function setQty(i,n){cart[i].qty=Math.max(1,Number(n)||1);updateCart();showCart()}
function removeItem(i){cart.splice(i,1);updateCart();showCart()}

function makeWhatsAppLink(message){
 return "https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(message);
}
function greeting(){
 const h=new Date().getHours();
 return h<12?"Good morning":h<17?"Good afternoon":"Good evening";
}
function orderSingle(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 const variation=document.getElementById("variation")?.value||"Not specified";
 const qty=Math.max(1,Number(document.getElementById("detailQty")?.value)||1);
 const price=p.price===null?"Price on Request":money(p.price);
 const msg=`Hello KINGZEE COLLECTION, ${greeting()}!

I want to order this product:

Product: ${p.name}
Category: ${p.category}
Price: ${price}
Quantity: ${qty}
Variation: ${variation}

My name:
My location:

Please confirm availability, final price, delivery and payment details. Thank you.`;
 window.location.href=makeWhatsAppLink(msg);
}
function checkout(){
 if(!cart.length){alert("Your cart is empty.");return}
 let total=0;
 const items=cart.map((x,i)=>{
  const p=products.find(y=>y.id===x.id);if(!p)return "";
  if(p.price!==null)total+=p.price*x.qty;
  return `${i+1}. ${p.name}
Quantity: ${x.qty}
Variation: ${x.variation||"Not specified"}
Price: ${p.price===null?"Price on Request":money(p.price)}`;
 }).filter(Boolean).join("\n\n");
 const msg=`Hello KINGZEE COLLECTION, ${greeting()}!

I would like to place an order:

${items}

Subtotal of priced products: ${money(total)}

Customer name:
Customer location:
Delivery or collection:

Please confirm availability, any outstanding prices, delivery fees and payment details.

Thank you.`;
 window.location.href=makeWhatsAppLink(msg);
}
function contact(){
 page(`<div class="panel"><h2>Contact KINGZEE COLLECTION</h2>
 <p>For product enquiries and orders, contact us on WhatsApp.</p>
 <h2>0559 11 42 51</h2>
 <a class="btn greenbtn" href="https://wa.me/${WHATSAPP_NUMBER}" target="_self">OPEN WHATSAPP</a></div>`);
}
function login(){
 if(owner){dashboard();return}
 const exists=localStorage.getItem("kc_owner_pin");
 page(`<div class="panel" style="max-width:440px;margin:35px auto">
 <h2>${exists?"Owner Login":"Create Owner PIN"}</h2>
 <p class="muted">${exists?"Enter your PIN to manage the store.":"Create your private owner PIN."}</p>
 <div class="field"><label>${exists?"Enter PIN":"Create PIN"}</label><input id="pin" type="password" inputmode="numeric"></div>
 ${exists?"":'<div class="field"><label>Confirm PIN</label><input id="pin2" type="password" inputmode="numeric"></div>'}
 <button class="btn" onclick="${exists?"verifyPIN()":"createPIN()"}">${exists?"LOGIN":"CREATE OWNER ACCESS"}</button>
 </div>`);
}
function createPIN(){
 const p=document.getElementById("pin").value;
 const p2=document.getElementById("pin2").value;
 if(p.length<4){alert("PIN must have at least 4 characters.");return}
 if(p!==p2){alert("PINs do not match.");return}
 localStorage.setItem("kc_owner_pin",p);
 alert("Owner PIN created.");login();
}
function verifyPIN(){
 if(document.getElementById("pin").value===localStorage.getItem("kc_owner_pin")){
  owner=true;dashboard();
 }else alert("Incorrect PIN.");
}
function logout(){owner=false;home()}
function dashboard(){
 if(!owner){login();return}
 page(`<div class="sectionhead"><h2>Owner Dashboard</h2><button class="btn redbtn" onclick="logout()">Logout</button></div>
 <div class="panel"><h2>Post New Product</h2>
 <div class="formgrid">
 <div class="field"><label>Product Name *</label><input id="pname"></div>
 <div class="field"><label>Category *</label><input id="pcat" list="categoriesList">
 <datalist id="categoriesList">${[...new Set(products.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join("")}</datalist></div>
 <div class="field"><label>Price in GH₵ (blank = Price on Request)</label><input id="pprice" type="number" min="0" step=".01"></div>
 <div class="field"><label>Stock</label><select id="pstock"><option>Available</option><option>Out of Stock</option><option>Preorder</option></select></div>
 <div class="field full"><label>Description</label><textarea id="pdesc"></textarea></div>
 <div class="field full"><label>Variations separated by commas</label><input id="pvars" placeholder="Black, White, Small, Medium"></div>
 <div class="field full"><label>Product Pictures</label><input id="pimages" type="file" accept="image/*" multiple></div>
 <div class="field"><label>Feature on Homepage?</label><select id="pfeatured"><option value="no">No</option><option value="yes">Yes</option></select></div>
 </div>
 <button class="btn goldbtn" onclick="postProduct()">SAVE PRODUCT</button></div>
 <div class="panel"><h2>Manage Products</h2><div id="ownerProducts"></div></div>
 <div class="panel"><h2>Owner Settings</h2>
 <button class="btn lightbtn" onclick="changePIN()">Change PIN</button>
 <button class="btn lightbtn" onclick="exportBackup()">Export Backup</button>
 <button class="btn lightbtn" onclick="importBackup()">Import Backup</button></div>`);
 renderOwner();
}
async function postProduct(){
 const name=document.getElementById("pname").value.trim();
 const category=document.getElementById("pcat").value.trim();
 const raw=document.getElementById("pprice").value;
 if(!name||!category){alert("Enter product name and category.");return}
 const price=raw===""?null:Number(raw);
 if(price!==null&&(!Number.isFinite(price)||price<0)){alert("Invalid price.");return}
 const files=[...document.getElementById("pimages").files];
 const images=await Promise.all(files.map(f=>f.arrayBuffer().then(b=>new Blob([b],{type:f.type}))));
 const p={
  id:crypto.randomUUID(),name,category,price,
  stock:document.getElementById("pstock").value,
  description:document.getElementById("pdesc").value,
  variations:document.getElementById("pvars").value.split(",").map(x=>x.trim()).filter(Boolean),
  featured:document.getElementById("pfeatured").value==="yes",
  images
 };
 await saveProduct(p);await refresh();alert("Product saved.");dashboard();
}
function renderOwner(){
 const el=document.getElementById("ownerProducts");if(!el)return;
 el.innerHTML=products.map(p=>`<div class="cartrow">
 <div style="flex:1"><strong>${esc(p.name)}</strong><p class="muted">${esc(p.category)} · ${p.price===null?"Price on Request":money(p.price)}</p></div>
 <button class="btn lightbtn" onclick="editProduct('${p.id}')">Edit</button>
 <button class="btn redbtn" onclick="removeProduct('${p.id}')">Delete</button>
 </div>`).join("")||'<div class="empty">No products posted.</div>';
}
async function editProduct(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 const name=prompt("Product name:",p.name);if(name===null)return;
 const category=prompt("Category:",p.category);if(category===null)return;
 const price=prompt("Price (blank for Price on Request):",p.price===null?"":p.price);if(price===null)return;
 const desc=prompt("Description:",p.description||"");if(desc===null)return;
 p.name=name;p.category=category;p.price=price.trim()===""?null:Number(price);p.description=desc;
 if(p.price!==null&&(!Number.isFinite(p.price)||p.price<0)){alert("Invalid price");return}
 await saveProduct(p);await refresh();dashboard();
}
async function removeProduct(id){
 if(!confirm("Delete this product?"))return;
 await deleteProduct(id);await refresh();dashboard();
}
function changePIN(){
 const old=prompt("Current PIN:");
 if(old!==localStorage.getItem("kc_owner_pin")){alert("Incorrect PIN");return}
 const p=prompt("New PIN:");
 if(!p||p.length<4){alert("PIN too short");return}
 if(prompt("Confirm new PIN:")!==p){alert("PINs do not match");return}
 localStorage.setItem("kc_owner_pin",p);alert("PIN changed.");
}
async function exportBackup(){
 const data=await getProducts(),media=[];
 for(const p of data)for(let i=0;i<(p.images||[]).length;i++){
  media.push({id:p.id,index:i,data:await blobToData(p.images[i])});
 }
 const clean=data.map(({images,...p})=>p);
 const file=new Blob([JSON.stringify({version:1,products:clean,media})],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(file);
 a.download="KINGZEE-COLLECTION-BACKUP.json";a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function blobToData(blob){
 return new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(blob)});
}
function dataToBlob(data){
 const [head,body]=data.split(",");
 const type=head.match(/:(.*?);/)[1],raw=atob(body);
 const bytes=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
 return new Blob([bytes],{type});
}
function importBackup(){
 const input=document.createElement("input");input.type="file";input.accept=".json";
 input.onchange=async()=>{
  try{
   const b=JSON.parse(await input.files[0].text());
   if(b.version!==1||!Array.isArray(b.products))throw Error();
   for(const p of b.products){
    p.images=(b.media||[]).filter(x=>x.id===p.id).sort((a,b)=>a.index-b.index).map(x=>dataToBlob(x.data));
    await saveProduct(p);
   }
   await refresh();alert("Backup imported.");dashboard();
  }catch(e){alert("Backup could not be imported.");}
 };
 input.click();
}
async function start(){
 await openDB();await refresh();updateCart();home();
}
start().catch(e=>{
 page('<div class="panel"><h2>Storage error</h2><p>Please open this file in Safari or Chrome rather than a document preview.</p></div>');
});
</script>
</body>
</html>
